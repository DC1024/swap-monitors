name: CI

# 为什么 CI 只跑这 18 个脚本：
#   test_selftest / test_maximized 需要**两块真实显示器**（runner 是 0 块屏的
#   headless 环境），verify_gui / tray_probe / demo_windows 是人工交互脚本。
#   剩下这些要么是纯逻辑，要么只依赖 Tk，可以在 GitHub 的 Windows runner 上跑。
#
# 环境差异（踩过坑）：runner 是英文系统、以 Administrator 运行、没有真实显示器。
# 所以凡是「本机跑过所以成立」的断言都必须显式处理：多屏才验的用 ⏭ 跳过，
# 别硬断言 —— 否则 CI 红的全是环境噪音，真问题反而被淹掉。
#
# 触发器里带上 push（不限分支）：这样推送修复分支时也能立刻看到 CI 结果，
# 不用等 PR。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一个分支连续推两次，取消前一次，省 runner 时间
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    # GitHub 的 Windows runner 是英文系统：stdout 被重定向成管道时用的是
    # cp1252，测试脚本里 `print("=== 1. 同分辨率…")` 会直接抛
    # UnicodeEncodeError 把整个测试崩掉（实测 5 个脚本全挂在这里，
    # 一行断言都没跑到）。程序本身不受影响 —— swap_windows.py 有
    # _harden_console() 兜着，退化输出 `?`；只有测试脚本没做这层保护。
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境信息
        run: |
          python -c "import sys, tkinter; print(sys.version); print('tk', tkinter.TkVersion)"

      - name: 语法检查
        run: python -m compileall -q swap_gui.py swap_windows.py make_icon.py tests

      # ---- 纯逻辑：不创建窗口、不移动窗口，任何机器都能跑 ----
      # 每个脚本单独跑、单独报，不能用 && 串：串起来第一个挂了后面的根本不跑，
      # 只能一轮一轮挤牙膏（实测连吃两次红，才把两个问题都看出来）。
      - name: 纯逻辑测试
        shell: bash
        run: |
          fail=0
          for t in test_map test_static test_elevate test_autostart test_hardening test_task_command test_hotkey_main_key test_move_window; do
            echo "::group::$t"
            python "tests/$t.py" || { echo "::error title=$t::tests/$t.py 有断言失败"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      # ---- 需要 Tk：会建主窗口并枚举一次窗口，但不动任何真实窗口 ----
      - name: GUI 相关测试
        shell: bash
        run: |
          fail=0
          for t in test_arrange test_preview test_regex_input test_hotkey_rollback test_tray_retry test_admin_mode test_focus_restore test_poll_resilience test_swap_serialized; do
            echo "::group::$t"
            python "tests/$t.py" || { echo "::error title=$t::tests/$t.py 有断言失败"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      # ---- 冒烟：CLI 真跑一次 ----
      # 逻辑放在 tests/test_cli_smoke.py 里，不要写成内联 shell：runner 上
      # `--list --json` 会返回 1 且没有任何输出，内联脚本里的 json.load 必崩。
      # 脚本自己会区分「环境不满足 → 显式跳过」和「真的坏了 → 红」。
      - name: CLI 冒烟
        run: python tests/test_cli_smoke.py
